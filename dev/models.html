<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glove Up · model viewer</title>
    <style>
      :root { --ink: #14182b; --paper: #fffaf0; --accent: #ff6b5a; --good: #2bb3a3; }
      html, body { margin: 0; height: 100%; background: #1b2340; color: var(--paper); font: 13px/1.3 'Nunito', system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #panel { position: fixed; top: 8px; left: 8px; width: 286px; max-height: calc(100% - 16px); overflow: auto; background: rgba(20, 24, 43, 0.86);
        border-radius: 12px; padding: 10px; box-sizing: border-box; }
      #panel.hidden { display: none; }
      #panel h2 { font-size: 12px; margin: 10px 0 4px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffd166; }
      #panel h2:first-child { margin-top: 0; }
      #panel button, #panel select { font: inherit; margin: 2px 2px 2px 0; padding: 4px 7px; border-radius: 7px; border: 0; background: #2d3a66; color: var(--paper); cursor: pointer; }
      #panel button:hover { background: #3d7bff; }
      #panel button.on { background: var(--good); }
      #status { position: fixed; right: 10px; bottom: 8px; font-size: 12px; color: #bfd7ff; text-align: right; pointer-events: none; }
      #extra { position: fixed; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70%; justify-content: flex-end; }
      #extra canvas { width: 160px; height: 160px; border-radius: 10px; background: #fff; }
      #extra figure { margin: 0; text-align: center; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"></div>
    <div id="extra"></div>
    <div id="status"></div>
    <script type="module" src="./models.js"></script>
  </body>
</html>
