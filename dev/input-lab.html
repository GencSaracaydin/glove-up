<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glove Up · Input Lab</title>
  <link rel="stylesheet" href="/src/ui/fonts.css" />
  <style>
    :root {
      --ink: #14182b; --ink-2: #1b2140; --ink-3: #242b52; --line: rgba(255, 250, 240, 0.08);
      --paper: #fffaf0; --muted: #a9b1d3; --faint: #6f789e;
      --accent: #ff6b5a; --good: #2bb3a3; --warn: #ffc94a; --p1: #3d7bff; --p2: #ff4d5e;
      --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
      --body: 'Nunito', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 700px at 30% -10%, #26306a 0%, var(--ink) 60%) fixed, var(--ink);
      color: var(--paper); font: 14px/1.35 var(--body); overflow: hidden;
    }
    button, select, input { font: inherit; color: inherit; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

    /* ── header ── */
    header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: rgba(20, 24, 43, 0.6); backdrop-filter: blur(6px); }
    h1 { font: 26px/1 var(--display); letter-spacing: 0.5px; margin: 0; white-space: nowrap; }
    h1 span { color: var(--accent); }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-left: auto; }
    .field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    select { background: var(--ink-3); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; text-transform: none; letter-spacing: 0; max-width: 220px; }
    .seg { display: inline-flex; background: var(--ink-3); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
    .seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; font-weight: 900; cursor: pointer; color: var(--muted); }
    .seg button.on { background: var(--paper); color: var(--ink); }
    .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 13px; }
    .btn { border: 0; border-radius: 12px; padding: 8px 16px; font-weight: 900; cursor: pointer; background: var(--ink-3); border: 1px solid var(--line); }
    .btn.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(255, 107, 90, 0.35); }
    .btn.on { background: var(--good); border-color: transparent; color: #fff; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    /* ── layout ── */
    main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px 18px; min-height: 0; }
    .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .card { background: linear-gradient(180deg, var(--ink-2), #181d38); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
    .card h2 { font: 16px/1 var(--display); letter-spacing: 0.4px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .card .sub { color: var(--faint); font-size: 12px; font-weight: 700; }

    /* ── stage ── */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0; background: #0f1326; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .badges { position: absolute; top: 12px; left: 12px; right: 140px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
    .badge { background: rgba(15, 19, 38, 0.78); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 900; font-size: 12px; white-space: nowrap; }
    .badge b { color: var(--muted); font-weight: 700; margin-right: 4px; }
    .badge.good { color: #7ff0dd; } .badge.warn { color: var(--warn); }
    .players { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
    .pchip { border-radius: 999px; padding: 4px 10px 4px 8px; font-weight: 900; font-size: 12px; background: rgba(15, 19, 38, 0.78); border: 2px solid var(--line); display: flex; align-items: center; gap: 6px; }
    .pchip i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
    .pchip.on i { background: var(--good); box-shadow: 0 0 10px var(--good); }
    .pchip.p1 { border-color: var(--p1); } .pchip.p2 { border-color: var(--p2); }
    .notice { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); text-align: center;
      background: rgba(255, 250, 240, 0.95); color: var(--ink); border-radius: 14px; padding: 10px 16px; font-weight: 800; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
    .notice small { display: block; font-weight: 700; color: #4a5175; margin-top: 2px; }
    .notice.error { background: #fff1ef; border: 2px solid var(--accent); }
    .notice.error strong { color: #c63a2b; }
    .idle { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-weight: 700; }
    .idle h3 { font: 30px/1.1 var(--display); color: var(--paper); margin: 0 0 6px; }

    /* ── side cards ── */
    .pcard { padding: 12px 14px; display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
    .pcard canvas { width: 150px; height: 112px; border-radius: 12px; background: #0f1326; display: block; }
    .pcard .head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
    .pcard .head .dot { width: 12px; height: 12px; border-radius: 50%; }
    .pcard .state { margin-left: auto; font-weight: 900; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ink-3); color: var(--muted); }
    .pcard .state.on { background: rgba(43, 179, 163, 0.18); color: #7ff0dd; }
    .meters { display: grid; grid-template-columns: 54px 1fr 40px; gap: 5px 8px; align-items: center; font-size: 12px; font-weight: 800; color: var(--muted); }
    .bar { position: relative; height: 8px; border-radius: 99px; background: var(--ink-3); overflow: hidden; }
    .bar > i { position: absolute; top: 0; bottom: 0; background: var(--paper); border-radius: 99px; }
    .bar.center::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint); }
    .meters .v { text-align: right; color: var(--paper); font-variant-numeric: tabular-nums; }
    .tut { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; font-size: 11px; font-weight: 800; color: var(--muted); }
    .tut span { padding: 2px 7px; border-radius: 999px; background: rgba(255, 250, 240, 0.06); }
    .tut span.on { color: #0f1326; background: var(--good); }
    .guardtag { font-weight: 900; color: var(--paper); }

    .log { flex: 1 1 auto; min-height: 120px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .log ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-height: 0; }
    .log li { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 10px; background: rgba(255, 250, 240, 0.03); }
    .log li time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; min-width: 46px; }
    .tag { font-size: 10px; font-weight: 900; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 999px; color: #fff; }
    .tag.p1 { background: var(--p1); } .tag.p2 { background: var(--p2); }
    .tag.found { background: var(--good); } .tag.lost { background: var(--warn); color: var(--ink); }
    .tag.err { background: var(--accent); } .tag.ui { background: #8a63d2; }
    .log .empty { color: var(--faint); font-weight: 700; }

    .rec { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .rec .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .rec .meta { color: var(--muted); font-weight: 800; font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
    .rec .btn { padding: 6px 12px; font-size: 13px; }
    .rec .btn.rec-on { background: var(--accent); color: #fff; border-color: transparent; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 107, 90, 0.2); } }
    input[type=file] { display: none; }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      main { grid-template-columns: 1fr; align-content: start; }
      .col { min-height: auto; }
      .stage { flex: none; aspect-ratio: 4 / 3; max-height: 66vh; }
      .log { min-height: 200px; max-height: 320px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Glove Up <span>Input Lab</span></h1>
      <div class="controls">
        <label class="field">Source <select id="source"></select></label>
        <label class="field">Model <select id="model"><option value="auto">Auto</option><option value="full">Full</option><option value="lite">Lite</option></select></label>
        <span class="field">Players <span class="seg" id="players"><button data-n="1" class="on">1</button><button data-n="2">2</button></span></span>
        <label class="field">Delegate <select id="delegate"><option value="GPU">GPU → CPU</option><option value="CPU">CPU only</option></select></label>
        <label class="field check"><input type="checkbox" id="assist" /> Keys too</label>
        <button class="btn primary" id="start">Start</button>
      </div>
    </header>
    <main>
      <div class="col">
        <section class="card stage" id="stage">
          <canvas id="preview"></canvas>
          <div class="idle" id="idle"><div><h3>Ready when you are</h3>Pick a source and press <b>Start</b>. Keyboard: J/K punch · U/I hooks · N/M uppercuts · Shift body · Space/B guard · A/D/S dodge</div></div>
          <div class="badges" id="badges"></div>
          <div class="players" id="pchips"></div>
          <div class="notice" id="notice" hidden></div>
        </section>
      </div>
      <div class="col">
        <section class="card pcard" id="card0"></section>
        <section class="card pcard" id="card1"></section>
        <section class="card log"><h2>Events <span class="sub" id="evcount"></span></h2><ol id="log"><li class="empty">Punches and tracking changes show up here.</li></ol></section>
        <section class="card rec">
          <h2>Record &amp; replay <span class="sub">raw pose frames · compact JSON</span></h2>
          <div class="row">
            <button class="btn" id="rec">● Record</button>
            <button class="btn" id="download" disabled>Download</button>
            <button class="btn" id="load">Load…</button>
            <button class="btn" id="replay" disabled>Replay</button>
            <label class="check field"><input type="checkbox" id="loop" checked /> Loop</label>
            <span class="meta" id="recmeta">0 frames</span>
            <input type="file" id="file" accept="application/json,.json" />
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="./input-lab.js"></script>
</body>
</html>
